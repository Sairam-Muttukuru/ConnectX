# ==========================================
# ConnectX Backend Application Configuration
# ==========================================
spring.application.name=connectx-backend
server.port=8080

# --- PostgreSQL Datasource Configuration ---
spring.datasource.url=jdbc:postgresql://localhost:5433/ConnectX-Db
spring.datasource.username=postgres
spring.datasource.password=Sairam@@12
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Settings (HikariCP)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# --- JPA / Hibernate Configuration ---
# Hibernate 6 auto-detects dialect from JDBC connection
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- CORS & Allowed Origins ---
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:3000,https://connect-x-lyart-xi.vercel.app

# --- ConnectX Frontend URL & Email Assets ---
connectx.frontend-url=${FRONTEND_URL:https://connect-x-lyart-xi.vercel.app}
connectx.email.assets-url=${EMAIL_ASSETS_URL:${connectx.frontend-url}/images/email}

# --- JWT Configuration ---
# 256-bit+ HMAC secret key
connectx.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# 24 hours in ms
connectx.jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:86400000}
# 7 days in ms
connectx.jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Backward-compatible alias
app.jwt.secret=${connectx.jwt.secret}
app.jwt.access-token-expiration-ms=${connectx.jwt.access-token-expiration}
app.jwt.refresh-token-expiration-ms=${connectx.jwt.refresh-token-expiration}

# --- Mail Configuration ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:bhavanimuttukuru@gmail.com}
spring.mail.password=${MAIL_PASSWORD:qtkovvqlxsrsaboc}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# --- Logging Configuration ---
logging.level.root=INFO
logging.level.com.connectx=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# --- Actuator Configuration ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


# Cloudinary configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
